appId: com.incitertech.activitytracker
productName: Activity Tracker

publish:
  provider: github
  owner: MohsinGhani
  repo: activity-tracker

directories:
  output: release

files:
  - main.js
  - preload.js
  - index.html
  - renderer.js
  - styles.css
  - firebase.js
  - screenshotStorage.js
  - manualOverride.js
  - config.js
  - assets/**
  - package.json
  - node_modules/**

asar: true
npmRebuild: false
buildDependenciesFromSource: false

win:
  target:
    - nsis
  icon: assets/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  # One "universal" app that runs on both Intel Macs and Apple chip (M1 and
  # later) Macs. The build machine is an Apple chip Mac, so without this the
  # app was built for Apple chips only and Intel Macs refused to open it
  # ("not supported on this Mac"). The window helper (get-windows /
  # active-win "main") is already universal.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  # Per-chip native bindings of the window helpers (prebuilt ones in
  # lib/binding, and the one npm compiles at install in build/Release). They
  # ship in both halves unchanged; the Mac app uses the universal "main"
  # helper, not these. Without this the universal merge stops on them.
  x64ArchFiles: "Contents/Resources/app.asar.unpacked/node_modules/{active-win,get-windows}/**/*.node"
  icon: assets/icon.icns
  # Hardened runtime enforces library validation, which makes the app refuse to
  # spawn/load the ad-hoc-signed active-win native helper (node_modules/active-win/main
  # and its Swift dylibs) — breaking active-app/window detection ("Unknown activity").
  # For ad-hoc / non-notarized builds it must be off. If you later notarize with a
  # real Developer ID, set this back to true AND add an entitlements plist granting
  # com.apple.security.cs.disable-library-validation (+ entitlementsInherit) so the
  # helper can still load.
  hardenedRuntime: false

linux:
  target:
    - AppImage
    - deb
  icon: assets/icon.png
  category: Utility
