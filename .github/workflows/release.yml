name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci
        env:
          PYTHON: python

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps
        env:
          PYTHON: python

      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PYTHON: python
  release_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install dmg-license
      - run: npx electron-builder install-app-deps

      # macOS only installs an auto-update if it is signed by the same
      # certificate as the running app. Ad-hoc builds get a new identity on
      # every build, so updates were always rejected. We sign with a stable
      # self-signed certificate; electron-builder only uses it once trusted.
      # We import into our own keychain instead of passing CSC_LINK:
      # electron-builder's temporary-keychain import fails on current
      # macOS runners (set-key-partition-list: "passphrase not correct").
      - name: Import and trust the code-signing certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ] || [ -z "$MAC_CERT_PASSWORD" ]; then
            echo "::error::MAC_CERT_P12_BASE64 / MAC_CERT_PASSWORD secrets are missing; the mac build would be ad-hoc signed and could not auto-update."
            exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 16)"
          echo "::add-mask::$KC_PW"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain .github/macos-signing-cert.pem
          security find-identity -v -p codesigning "$KC"
          echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_NAME: Inciter Tech Activity Tracker

      - name: Verify the app is signed with the stable certificate
        run: |
          APP="$(ls -d release/mac*/*.app | head -1)"
          REQ="$(codesign -d -r- "$APP" 2>&1 | tail -1)"
          echo "$REQ"
          echo "$REQ" | grep -q 'certificate root = H"b41ac1bc41106b5caca86e71b8cb8d9d5307833c"' || {
            echo "::error::$APP is not signed with the Inciter Tech certificate; do not publish this release."
            exit 1
          }

  release_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder install-app-deps
      - run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
